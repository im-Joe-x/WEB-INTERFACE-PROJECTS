<!doctype html><html><head><title>User Registration Form</title><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><h1>User Registration Form</h1><p class="subtitle">Fields marked with * are mandatory and are validated</p><div class="note">Note: Username must exactly match the name entered in the Aadhar Name field.</div><form id="regForm" novalidate><div class="field"><label>Username*</label><input id="username"><span class="error" id="err-username"></span></div><div class="field"><label>Aadhar Name*</label><input id="aadharName"><span class="error" id="err-aadharName"></span></div><div class="field"><label>Email*</label><input id="email"><span class="error" id="err-email"></span></div><div class="field"><label>Mobile Number*</label><div class="phone-row"><select id="countryCode"><option value="">Code</option><option>+91 (IN)</option><option>+1 (US)</option><option>+44 (UK)</option><option>+61 (AU)</option><option>+971 (UAE)</option></select><input id="mobile" maxlength="10" placeholder="10 digit number"></div><span class="error" id="err-mobile"></span></div><div class="field"><label>Password*</label><input type="password" id="password"><span class="error" id="err-password"></span></div><div class="field"><label>Confirm Password*</label><input type="password" id="confirmPassword"><span class="error" id="err-confirmPassword"></span></div><div class="field full"><label>Permanent Address*</label><textarea id="permanentAddress"></textarea><span class="error" id="err-permanentAddress"></span></div><div class="field full"><label>Temporary Address*</label><textarea id="tempAddress"></textarea><span class="error" id="err-tempAddress"></span></div><div class="field"><label>Upload Photo (jpg/png, max 2MB)*</label><input type="file" id="photo" accept=".jpg,.jpeg,.png"><span class="error" id="err-photo"></span></div><div class="field"><label>Date of Birth</label><input type="date"></div><div class="field"><label>Gender</label><select><option>Select</option><option>Male</option><option>Female</option><option>Other</option></select></div><div class="field"><label>Occupation</label><input></div><div class="field"><label>Hobbies</label><input></div><div class="field"><label>Alternate Phone Number</label><input></div><div class="success-msg" id="successMsg">Registration submitted successfully!</div><div class="actions"><button type="submit">Submit</button><button type="reset" id="resetBtn">Reset</button></div></form></div><script src="script.js"></script></body></html>
